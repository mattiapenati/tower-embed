[workspace]
members = [".", "crates/*", "examples/*"]

[workspace.package]
version = "0.4.0"
authors = ["Mattia Penati <mattia.penati@protonmail.com>"]
edition = "2024"
license = "Apache-2.0 OR MIT"
homepage = "https://github.com/mattiapenati/tower-embed"
repository = "https://github.com/mattiapenati/tower-embed"

[workspace.dependencies]
tower-embed = { path = "." }
tower-embed-core = { path = "crates/tower-embed-core" }
tower-embed-impl = { path = "crates/tower-embed-impl" }

[package]
name = "tower-embed"
description = "Tower service to serve embedded assets"
keywords = ["tower", "http", "static"]
documentation = "https://docs.rs/tower-embed"
version.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
autoexamples = false

[dependencies]
tower-embed-core = { path = "crates/tower-embed-core", version = "0.4.0" }
tower-embed-impl = { path = "crates/tower-embed-impl", version = "0.4.0" }

[features]
default = ["tokio"]
tokio = ["tower-embed-core/tokio"]
